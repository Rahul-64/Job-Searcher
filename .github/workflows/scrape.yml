name: scrape

# Daily scrape. Cron is in UTC: 30 0 * * * = 06:00 AM IST.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o scraper ./cmd/scraper
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: ./scraper migrate
      # Phase 2 will replace this with: ./scraper run-due
      - name: Scrape due sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: echo "scraping arrives in phase 1/2"
